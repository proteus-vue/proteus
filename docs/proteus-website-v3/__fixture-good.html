<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Example — should pass</title>
<style>
:root{ --bg:#0a0a0c; --brand:#7c5cff; --ink:#f2f2f5; --line:#26262e; --panel:#121216; --ios:#0a84ff; --and:#3ddc84; --flutter:#54c5f8; --skia:#ffd54f; }
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <h1>One semantic model. Any engine — at every layer.</h1>
  <p>iOS uses <span style="color:var(--ios)">blue</span>; Android uses <span style="color:var(--and)">green</span>.</p>
  <pre id="src">const x = 1;</pre>
  <div class="ir-panel" id="ir">{ "renderBackend":"ios" }</div>
  <script>
    // 切换 Backend，但绝不修改 #src（不变式）
    document.getElementById('ir').textContent = 'updated IR only';
  </script>
</main>
</body>
</html>
