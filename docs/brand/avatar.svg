<?xml version="1.0" encoding="UTF-8"?>
<!-- Proteus 头像（主选）· 多彩立方体
     「大厂多色组合」：图形本体三面各持一色（非「纯色底 + 白字」）——Fluent / Kotlin / Jetpack 一路。
     隐喻：立方体 = 一套源码；三个面 = 多个渲染目标；内部棱白缝 = 同一体的多面（仅内缝，外轮廓靠面色收边）。
     ★几何（512 画布，精确）：等距 L=150，中心 (256,262)
       顶面  256,112  385.9,187  256,262  126.1,187
       左面  126.1,187  256,262  256,412  126.1,337
       右面  256,262  385.9,187  385.9,337  256,412
       内缝  UL→C、UR→C、C→B（三面共享棱）
     容器：白色圆角方形 rx=116 -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Proteus">
  <title>Proteus · one source, any render engine</title>
  <defs>
    <linearGradient id="pTop" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="pLeft" x1="0.25" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="pRight" x1="0.75" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#ffffff"/>
    <polygon points="256,112 385.9,187 256,262 126.1,187" fill="url(#pTop)"/>
    <polygon points="126.1,187 256,262 256,412 126.1,337" fill="url(#pLeft)"/>
    <polygon points="256,262 385.9,187 385.9,337 256,412" fill="url(#pRight)"/>
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="126.1" y1="187" x2="256" y2="262"/>
      <line x1="385.9" y1="187" x2="256" y2="262"/>
      <line x1="256" y1="262" x2="256" y2="412"/>
    </g>
  </g>
</svg>
