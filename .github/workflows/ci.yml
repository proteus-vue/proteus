name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: test + build（v0.2 工程化基线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查（vue-tsc 全项目，含 packages/compiler）
        run: npx vue-tsc --noEmit

      - name: 单元测试（router / mp-transform / runtime / transforms / explain / overrides / golden / plugin）
        run: npm test

      - name: 小程序构建（gen-routes → vue-tsc → vite build:mp）
        run: npm run build:mp

      - name: Web 构建
        run: npm run build:web

      - name: 编译引擎独立包构建（@proteus/compiler → dist/ .d.ts）
        run: npm run build -w @proteus/compiler

  e2e-web:
    name: Web E2E（Playwright，需 Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: Web E2E（SPA 跳转 / 转场 / tap 计数）
        run: npm run test:e2e:web
