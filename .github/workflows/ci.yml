name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: test + build（拆包完成：全部 @proteus-vue/* 包独立构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（--ignore-scripts：postinstall 构建移交显式步，避开 fresh 环境 install 期构建时序问题）
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 安装 Rust 工具链（排版核心单测 + 更新指令双端对齐需要）
        uses: dtolnay/rust-toolchain@stable

      - name: 构建 workspace 包（cli/component-ir/desktop 等 dist——vue-tsc/tests 子路径解析需要）
        run: node scripts/build-packages.mjs

      - name: 类型检查（vue-tsc 全项目，含 packages/*）
        run: npx vue-tsc --noEmit

      - name: 示例工程类型检查（examples 独立 tsconfig，完整工程形态）
        run: cd examples && npx vue-tsc --noEmit -p tsconfig.json

      - name: 文档全端视角写作门禁（#487：双端世界观句式回归阻断——guides/framework zh+en）
        run: node scripts/check-all-target-wording.mjs

      - name: 全量 script 编译门禁（#497：examples+组件全部 .vue 一次整包编译 + js 语法校验——防 demo 逐个暴露编译器形态缺口）
        run: node scripts/check-script-compile.mjs

      - name: 盲等门禁（★用户红线：脚本内 sleep 一律禁止——要么 App/被测对象主动上报，要么 wait_for.sh 条件等待）
        run: node scripts/check-no-blind-wait.mjs

      - name: 逐帧通道去 JSON 门禁（★S2/#769：指令字节必须走 applyOpsBytes 字节直传，禁 number[] JSON——防静默回退）
        run: node scripts/check-no-json-wire.mjs

      - name: 输入延迟门禁（★S6/#767：帧 p95 ≤ 1 帧预算 + High input latency 对基线宽棘轮）
        run: node scripts/check-input-latency.mjs

      - name: Dactyl 预算门禁（★D0/#772：dactyl-metrics 契约 + work_time_p95/jank 预算；无采样则如实 ◐）
        run: python3 hosts/shared/dactyl/measure-latency.py --selftest && node scripts/check-dactyl-budget.mjs

      - name: 交互折叠契约棘轮（★S3-T4/#779：可折叠必折 · 不可折叠必诊 · 无静默——防 R1 折叠误判）
        run: node scripts/check-interaction-folding.mjs

      - name: 安全编辑门禁（★用户纪律：程序化编辑必须走 safe-edit——临时文件 + diff + 校验，禁止直接改源文件）
        run: node scripts/check-safe-edit.mjs

      - name: 运行时桥源同步门禁（★决策 #666：真源 hosts/shared/bridge/entry-superapp.ts ⇄ CLI 随包副本不得漂移——外部用户走副本，改了真源没同步副本即跑旧逻辑）
        run: node scripts/sync-host-bridge.mjs --check

      - name: 凭证入库扫描门禁（★hosts 第二刀 Stage 3：签名/密钥/明文口令不得入库——git 跟踪面）
        run: node scripts/check-secret-scan.mjs

      - name: iOS 签名切换自测（★两台电脑（家/办公室）按主机名分档——判据纯逻辑、零钥匙串依赖）
        # ★为什么可在 CI 跑：自测只注入数据验证 `resolveForPin`（描述文件授权 ∩ 钥匙串 等 7 用例），
        #   不触钥匙串/描述文件/网络。守的是"两台机器各自上档后解析不会选错证书"（续签同名多张的场景）。
        run: node hosts/ios/lib/ios-signing.selftest.mjs

      - name: 内核配套断言覆盖门禁（★用户点名：内核改动总要同步配套断言——映射表须覆盖全部内核文件）
        # ★为什么需要：精化映射表是人工维护的 ⇒ 新增内核文件（packages/compiler/src/*.ts）时若没人补表，
        #   定向工具会静默退化为"宽面提示" ⇒ 配套断言又只能在全量里才发现（用户点名的低效率模式）。
        #   本门禁 = 表的元防腐化（未覆盖且未豁免 ⇒ 红）；秒级、纯静态、零构建依赖。
        run: node scripts/test-coupling.mjs --coverage

      - name: 能力清单跨语言 golden 门禁（★HA3：golden 与 TS 侧 scanCapabilities 产出必须一致）
        # ★为什么需要：Rust 侧的消费判据只能证明"冻结那一刻"两边一致；TS 侧改了形状而 golden
        #   没重生成 ⇒ 静默失效。本门禁每次重新生成并逐字节比对（TS 侧一动就红）。
        run: node scripts/check-capability-golden.mjs

      - name: 分层依赖门禁（★HA0.5：platform/ 不得引用 hosts/ 与 Host ABI —— 换宿主的收益靠它守住）
        # ★2026-09-30 加：分层只写在文档里必然漂移；平台层一旦"顺手"import 宿主 ⇒ 编译照过、分层塌了。
        run: node scripts/check-platform-layering.mjs

      - name: Morpheus 动画说明书门禁（★说明书 ↔ 实现/内核对账 + 生成物一致——Morpheus §13 第 11 条）
        # ★2026-09-30 加：说明书是**自描述**，没人对账就会变成"文档说一套、实现另一套"
        #   （实测抓到 README 曲线名漂移）；conformance + 生成物一致性都在本脚本里判。
        run: node scripts/gen-anim-manual.mjs --check

      - name: iOS JSExport 接线门禁（★JS 调用 / 协议声明 / Bridge 实现三处一致——缺协议声明会运行时 TypeError）
        # ★2026-09-30 加：真机连踩两次（layerZProbe 只在 view 上、未进 JSExport 协议 ⇒ JS TypeError；
        #   而当时相位无统一异常捕获 ⇒ 该读数"为空"、判据"该组跳过"变绿 = 做错了伪装成没做）。
        #   纯静态、零依赖 ⇒ 接 CI。
        run: node scripts/check-ios-export-wiring.mjs

      - name: 能力优先级表门禁（NC0：能力清单 × 语料需求 × 官方承接 ⇒ 表与源一致；分域 0 缺口）
        run: node scripts/gen-capability-priority.mjs --check

      - name: 声明式能力桥门禁（NC1：声明 → 生成 → 合并进 bridge；漂移即红）
        run: node scripts/gen-bridge-ext.mjs --check

      # ★★2026-09-29 修正**步骤顺序**（此前必然红）：`tests/vapor-v3-e2e.test.ts` 需要
      #   `target/debug/examples/ops_roundtrip`，而构建它的步骤排在 `pnpm test` **之后**
      #   ⇒ CI 上四条端到端用例报 `ENOENT`（看起来像链路坏了，实际是装置没建）。
      #   本仓已实测：该红在本地被"上一次构建残留的二进制"掩盖 —— 干净克隆/CI 才暴露。
      #   ⇒ 装置构建**前置**到测试之前（与 `test:rust` 一起；两者都只需 cargo）。
      - name: 构建 V3 端到端驱动（★必须在 pnpm test 之前：vapor-v3-e2e 需要该二进制）
        run: cargo build --manifest-path packages/layout-core-rust/Cargo.toml --example ops_roundtrip

      # ★★★2026-10-10 补两处 `pnpm test` 前置（此前**必然红**，只在干净克隆/CI 暴露）：
      #   ① Chromium——`tests/consistency-web-probe.test.ts` 等非 e2e 测试用 Playwright 起真浏览器
      #      （`pnpm test` 只排除 `e2e-*.test.ts`，这些**不排除**）⇒ 缺浏览器报
      #      `browserType.launch: Executable doesn't exist .../chrome-headless-shell`。
      #   ② App 屏内容产物——`tests/app-screen-content-gate.test.ts` 读
      #      `examples/dist/app/android/screen-content.json`，而 CI 里唯一构建它的 `build:android`
      #      排在 `pnpm test` **之后**（旧顺序）⇒ 文件不存在 ⇒ `ENOENT` 崩。
      #   ★与上方 vapor-v3-e2e 同源教训：**测试需要的前置必须排在测试之前**；本地被残留产物/已装浏览器掩盖。
      - name: 安装 Chromium（★必须在 pnpm test 之前：consistency-web-probe 等非 e2e 测试用 Playwright）
        run: npx playwright install --with-deps chromium

      - name: 构建示例 App 屏内容产物（★必须在 pnpm test 之前：app-screen-content-gate 读它）
        run: pnpm run build:android

      - name: 单元测试（router / router-plan / gen-routes / plugin / runtime / compiler / golden / pinia）
        run: pnpm test

      - name: 排版核心单测 + 更新指令双端对齐（Vapor IR V1：TS 编码 ⇄ Rust 解码的跨语言契约）
        run: pnpm run test:rust

      - name: Vapor IR 性能棘轮（★只降不升——防平移传播/返回通道优化被静默回退）
        run: pnpm run check:vapor-perf

      - name: ★★★Vapor 三端同步（用户指令 2026-10-03「后面的 vapor 推进就三端同步走」）
        # 消费**已入库**的三端真机结果（hosts/{android,harmony,ios}/results/vapor.json）：
        #   ① 证据齐（缺一端即红——陈旧证据会冒充新证据）② 同一份判据三端全过（◐ 如实跳过会列出）
        #   ③ 指纹逐项一致（同一份产物 ⇒ 必须同结果；不一致 = 有一端没重跑，报出是哪端哪个字段）
        # ★真机重跑在 CI 之外（无真机/模拟器）：hosts/*/run-*.sh；本步只复算+比对。
        run: pnpm run check:vapor-three-end

      - name: Vapor 能力缺口棘轮（P4 能力视图：explain 两侧诊断合并 + 缺口只减不增）
        # ★为什么在 CI：纯静态分析（examples/pages 的 SFC 走编译器）+ 基线对比——零设备依赖。
        #   ① error 级缺口零容忍（"静默出错"类）② 按 code 计数棘轮（新增缺口当场红）。
        #   ★本门禁同时是"诊断工具不再吞诊断"的回归锁（模板侧诊断必须进总账）。
        run: pnpm run check:vapor-capability

      - name: 坐标吸附跨语言 golden（卡 I2：TS ⇄ Rust 同输入同输出——三端差 1px 的机器判据）
        run: pnpm run check:pixel-snap

      # ★★★G-61 B0（2026-10-05）：跨端 CSS 引擎（PCE）契约冻结的三道门禁——
      #   ① StyleIR 契约（字段闭集/scope/值类型/棘轮/SPI 对齐 + 源 SSOT 与产物不漂移）
      #   ② StyleIR 规范化编码 golden（INV-CE-01 编码层；Rust 侧对拍在 pnpm test 的 style-ir-golden.test.ts）
      #   ③ Web 基准 manifest（D2 冻结 / D3 环境指纹 / D4 锚点；基准守护的清单载体）
      - name: StyleIR 契约门禁（G-61 B0：三表合一的字段闭集 + 棘轮 + SPI 对齐）
        run: pnpm run check:style-ir-schema

      # ★★★G-61 B3（2026-10-05）：数值等价覆盖门禁——每个 semantic 字段 ↔ 快照读数
      #   （B3 验收"L2 覆盖 → 全覆盖"的机器判据；映射表单一事实源 + 闭集同源 + 棘轮 + 无孤儿键）
      - name: 数值等价覆盖门禁（G-61 B3：semantic 字段全覆盖）
        run: pnpm run check:style-coverage

      # ★★★G-61 B4（2026-10-05）：CSE lint 存量基线（E-CSS/W-CSS 族棘轮——只减不增）
      - name: CSE lint 存量基线漂移（G-61 B4）
        run: pnpm run check:cse-lint-baseline

      # ★★★G-61 B5（2026-10-05）：基准守护三件（写入守卫 / 变更审批 / 清单已在上方）
      #   ——腐化检测（check:baseline-freshness）**非门禁**（需活体重采+浏览器版本易变），不入 CI
      - name: 基准写入守卫（G-61 B5 · D5：基准不得由被测端自证）
        run: pnpm run check:baseline-write-guard

      - name: 基准变更审批（G-61 B5 · D2/D3：[baseline-bump] + 批准人 + 原因）
        run: pnpm run check:baseline-approval

      - name: StyleIR 规范化编码 golden（G-61 B0：跨语言逐字节——TS 编码器 ≡ 冻结期望）
        run: pnpm run check:style-ir-golden

      - name: Web 基准 manifest（G-61 B0：基准三件套寻址 + 环境指纹 + 锚点合法性）
        run: pnpm run check:baseline-manifest

      - name: CSS 能力对齐清单漂移（三端 Web/Skyline/App：编译器属性集 ⇄ 清单 ⇄ 源工件；防清单落后于编译器/源）
        run: pnpm run check:css-capability-alignment

      - name: Profile 边界基线漂移（VC2-b：存量只减不增——新增越界样式必须修或在评审中显式刷新基线）
        run: pnpm run check:profile-baseline

      - name: 页面层级语义（LY1 · 禁裸 z-index / Mask 单独用 / Popout·Mask 非根容器——WeUI 四层语义）
        run: pnpm run check:layers

      - name: 可停靠滚动容器（SC2 · 档位≤3递增 / nested 必填 / initial∈detents / 无逃生口）
        run: pnpm run check:scroll-safety

      - name: 三端松手惯性接线（手指拖拽 + 惯性两段；挡"代码在、没接线"回归）
        run: pnpm run check:scroll-fling

      - name: doctor 注册表自检（M5 · id 唯一/命名/组齐/失败码已登记）
        run: pnpm run check:doctor-registry

      - name: CLI 建议解耦框架源码（无 hosts/ · scripts/setup- · build-runtime-aar.sh 死链）
        run: pnpm run check:cli-advice

      - name: SFC 五端报告（含**留白 16±0.5 硬断言** + 双口径差异率透明化——夹具口径不遮饰）
        run: pnpm run check:consistency-sfc

      - name: 一致性指标 + 允许差异清单 schema（CS1/CS2：M1–M4 复算一致 · M4 的 L1 算子必须全捕获）
        run: pnpm run check:consistency-metrics

      - name: Themis 引擎数字 SSOT（IR 字段 / 逐属性对拍 / M1 / lint 棘轮 / 能力清单——从产物复算，防白皮书与页面漂移）
        run: pnpm run check:css-engine-numbers

      - name: 三端快照同一格式（VC3/VC4：Web golden ⇄ App 内核工件 ⇄ 小程序双模式，过同一校验器）
        run: pnpm run check:consistency-snapshot

      - name: L4 像素观察报告（VC7：**非门禁**——观察结论不进退出码；schema 违规才红）
        run: pnpm run check:consistency-pixel

      - name: 双端 golden 单一来源（★2026-10-01：两端 conformance golden 必须同源——不同源会让
              覆盖面不一致，收「双端几何一致性」判据时变成**装置性判红**）
        run: pnpm run check:cross-end-golden

      - name: 每帧动画记录线格式（★2026-10-01 颜色通道扩到 28B：内核产出的宽度必须与三处
              消费端常量一致——历史上错位解析过，本门禁从内核写入序列**推出**宽度再比对）
        run: pnpm run check:anim-record-bytes

      # ★★决策 #721：Android runtime AAR 新鲜度（runtime/*.java 内容哈希 ↔ 入库 AAR）。
      #   改了 runtime Java（如 #714 drainDevFrameStats / #719 highlightNode）却忘重建 AAR ⇒
      #   CLI 生成的宿主壳编译不过（"找不到符号"）——本仓实测栽过 2 次（#685 / #721）。
      #   ★纯 Node 内容哈希 ⇒ CI 可跑（不需 NDK）。
      - name: Android runtime AAR 新鲜度（runtime 源哈希 ↔ 入库 AAR，防"源改了 AAR 没重建"）
        run: pnpm run check:android-runtime-aar-fresh

      # ★★★决策 #725：鸿蒙 runtime HAR 随包副本新鲜度（prebuilt ⇄ 真源 逐字节哈希）。
      #   改了 hosts/harmony/.../proteus_render 却没同步 prebuilt/harmony ⇒ **外部用户（无框架 checkout）
      #   跑旧运行时**（本地全绿、外部错——同 #666/#721）。★纯 Node 内容哈希 ⇒ CI 可跑（不需 DevEco）。
      - name: 鸿蒙 runtime HAR 随包副本新鲜度（prebuilt ⇄ 真源，防"真源改了副本没同步"）
        run: pnpm run check:harmony-runtime-prebuilt

      # ★★★三端宿主变体一致性（dev-host = 宿主）：每端**单一壳**、功能清单齐全、dev 件以 DEV 门控、
      #   android release 无 INTERNET。防「功能误入 if(DEV) / dev-only 文件 ⇒ **release 静默丢功能**」。
      - name: 三端宿主变体一致性（dev-host = 宿主：单一壳 + dev 件门控 + 功能齐全）
        run: pnpm run check:host-variant-parity

      # ★★C2（2026-10-01）：SVG 段列表的跨语言序列化形态（内核 serde ⇄ 两端翻译器）——
      #   真缺陷教训：两端各写"臆想的形态" ⇒ 层建不出来而内核读数全对（静默）。
      - name: SVG 段列表跨语言形态（C2：内核 serde ⇄ 双端翻译器）
        run: pnpm run check:svg-path-shape

      # ★★渐变填充（v1，2026-10-01）：契约键名（TS 声明面为唯一事实源）⇄ 两端宿主 + 适配器——
      #   漏一个键名 = 该维度在某一端静默降级（渐变的"跨语言形态"与 SVG 段同源教训）。
      - name: 渐变跨语言契约（TS 声明 ⇄ 双端宿主 ⇄ 适配器透传）
        run: pnpm run check:gradient-contract

      - name: 依赖声明完整性审计（#422：pnpm 严格解析——import vs package.json 零缺失）
        run: node scripts/check-deps.mjs

      - name: stores 铁律门禁（M8.4：禁平台分支/直连存储）
        run: |
          if grep -rEn "wx\.setStorage|localStorage\.setItem|sessionStorage|if.*process\.env" examples/stores/ 2>/dev/null; then
            echo "::error::stores/ 违规：禁止平台分支与直连存储（见 docs/pinia-stores-conventions.md）"
            exit 1
          fi
          echo "stores 纯净性 OK（注册表完整性由 vue-tsc + stores-registry.types.ts 校验）"

      - name: 能力体系门禁（platform-plan B5 平台规范硬卡 + B3 编译期分叉缺失报告）
        run: |
          npx tsx packages/cli/src/index.ts capabilities:check examples
          npx tsx packages/cli/src/index.ts capabilities:manifest examples --platform skyline
          npx tsx packages/cli/src/index.ts capabilities:manifest examples --platform web

      - name: 组件库审计门禁（B8：no-platform-api / no-sync-storage / manifest-complete）
        # ★组件库拆包（2026-09-14）：组件由 src/components 迁至 packages/components（第 41 包）——
        #   此处路径必须同步，否则审计在空目录上运行（0 组件 + manifest-complete 违规）→ 假红。
        run: npx tsx packages/cli/src/index.ts components:audit packages/components

      - name: 官方能力覆盖门禁（★权威标尺：官方清单 spec 驱动 + 棘轮——未归类/覆盖回退即红）
        run: |
          node scripts/gen-mp-spec.mjs --check
          npx tsx packages/cli/src/index.ts audit coverage

      - name: 端对齐属性棘轮门禁（★主标尺：官方属性级覆盖不得回退——只增不减）
        # ★2026-09-18 补接线：此前该门禁**只在本地 `pnpm verify` 链**、不在 CI →
        #   属性覆盖回退（本会话全部工作围绕的 310/310）可以推上去而 CI 不拦。
        #   依赖官方文档页（需出网）；离线时脚本诚实跳过并告警，不误红（见 gen-mp-component-attrs.mjs --check）。
        run: |
          node scripts/gen-mp-component-attrs.mjs --check
          node scripts/audit-component-attrs.mjs

      - name: 官网目录数据门禁（catalog 快照幂等 + route 无死链 —— 防「可点击但页面不存在」）
        run: node scripts/gen-showcase-catalog.mjs --check

      - name: 能力详情页门禁（页面与数据表一致 —— 防手改生成物/漏重跑脚本）
        run: node scripts/gen-capability-demo-pages.mjs --check

      - name: 组件详情页与数据表一致（--check）
        run: node scripts/gen-component-demo-pages.mjs --check

      # ★2026-09-24 补：showcase 详情页类型检查（subpackages 下 102 页此前完全未检查——
      #   实测漏掉「把异步 hook 当同步句柄用」的运行时 TypeError）
      - name: 类型检查（showcase 详情页，含 subpackages）
        run: npx vue-tsc --noEmit -p showcase/tsconfig.json

      - name: 包健康门禁（包名/导出/构建配置齐备 —— 拆包后尤其重要）
        run: node scripts/check-package-health.js

      # ★发布物内容门禁（2026-09-20 事故后新增）：核对**实际打出去的包里有什么**——
      #   `components` 曾丢了全部 74 个 p-* 组件而其余门禁全绿（它们查的是「我声明的」）。
      #   放在 CI 每次跑，是为了在 PR 阶段就拦住「files 声明改了但通配不展开」这类回退。
      - name: 发布物内容门禁（files 命中 / 入口 / 相对 import 闭包全在包内）
        run: node scripts/check-publish-contents.mjs

      - name: 内部版本对齐门禁（★2026-09-19 事故：模板/examples 的 @proteus-vue/* 声明必须 = workspace 实际——陈旧会让用户装到旧包并产生重复副本）
        run: node scripts/sync-internal-versions.mjs --check

      - name: 属性降级声明门禁（批次 4 M6 · EA-5：全组件属性三态无空白格 + fallback 可观察 + 与官方清单交叉核对）
        run: node scripts/audit-degradation.mjs

      - name: 跨层一致性门禁（铁律 scope 统一 + G 表一致 + 包注册表对照）
        run: node scripts/check-consistency.js

      - name: 门禁通道一致性（★2026-09-18：防「CI 与 verify 两套门禁各自不完整」再度发生）
        run: node scripts/check-gates-sync.mjs

      - name: 项目记忆收纳门禁（★2026-10-03：防 PROJECT_MEMORY 长回 2.4MB——薄入口 + 归档索引自洽）
        run: node scripts/check-memory.mjs

      - name: 原语清单生成物漂移门禁（★批次 7：gen:docs 此前从未接线，catalog.md 静默过期多批）
        run: npx tsx scripts/gen-docs.ts --check

      - name: 国际化消息审计（i18n-plan B2：缺失 key 阻断）
        run: npx tsx packages/cli/src/index.ts i18n:check examples --catalog examples/locales/zh-CN.json

      - name: 类型单一来源门禁（types-plan B7：generate types --check 防 schema 漂移）
        run: |
          npx tsx packages/cli/src/index.ts generate types
          npx tsx packages/cli/src/index.ts generate types --check
          npx tsx packages/cli/src/index.ts config:check examples/proteus.config.ts

      - name: 小程序构建（示例工程：gen-routes → vue-tsc → vite build:mp）
        run: pnpm run build:mp

      - name: 小程序产物完整性门禁（引用闭环：声明 ⇒ 四件套存在——防「未找到组件」启动失败）
        run: pnpm run check:mp-artifacts

      - name: App 端 CSS 支持面对照门禁（阶段 0 · 三表分层对照棘轮）
        run: pnpm run check:app-css-surface

      - name: App 屏内容产物门禁（内核契约：枚举封闭集 + 树结构不变量）
        run: pnpm run check:app-screen-content

      - name: Web 构建（示例工程）
        run: pnpm run build:web

      - name: 全部 @proteus-vue/* 包独立构建（compiler/router/runtime/shared/plugin-vite/cli/@proteus-vue/create-proteus → dist）
        run: pnpm -r build

      - name: 性能基准回归门禁（G-30：功能基准 >1.5x 基线阻断 / >1.2x 警告）
        run: pnpm run bench

      - name: 模板快照一致性（快照后 git 无差异 → 模板与主仓同步）
        run: |
          npx tsx scripts/snapshot-template.ts
          git diff --exit-code -- packages/create-proteus/templates

  website-docs:
    name: 官网文档门禁（G-60 文档即契约：WIT 漂移阻断 + 生成器幂等）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 构建 workspace 包（官网 import @proteus-vue/* 走 dist）
        run: node scripts/build-packages.mjs

      - name: SPEC_LINT + 生成物漂移门禁（WIT SSOT 不一致即阻断）
        run: cd website && pnpm run check:plugin-docs

      - name: 参考文档漂移门禁（CLI/编译规则目录/CSS 兼容规则/CSS 支持参考/组件能力页/配置参考与源一致）
        run: cd website && pnpm run check:reference && pnpm run check:config-ref && pnpm run check:css-compat && pnpm run check:css-support && pnpm run check:content && pnpm run check:doc-links

      # ★★CS6（2026-10-02）：一致性标准页数据门禁——页面展示的 M1–M4 / 允许差异清单 / 真截图
      #   必须与 docs/generated/*.json 逐字节一致（SSOT=机器产物；页面零手写数字，防"产物变了页面说谎"）
      - name: 一致性页数据门禁（页面 ↔ docs/generated 机器产物同源）
        run: cd website && pnpm run check:consistency-data

      # ★★★Themis（CSS 引擎）产品页数据门禁（2026-10-08）：页面展示的 IR 字段 / 逐属性对拍 /
      #   M1 / lint 棘轮 / 能力清单 + 四端真截图，必须与 SSOT 逐字节一致（页面零手写数字）
      - name: Themis 页数据门禁（页面 ↔ 数字 SSOT + 四端真截图同源）
        run: cd website && pnpm run check:css-engine-data

      # ★2026-09-27：文档组件名对账（vue 代码块里引用不存在的组件会让读者照抄报错——
      #   `p-card` 曾在 3 处文档里潜伏，既有门禁全放行）
      - name: 文档组件名对账门禁（vue 代码块 ↔ 已注册组件）
        run: cd website && pnpm run check:doc-components

      - name: 原语分区漂移门禁（★#460：desktop 模块页由源码生成，勿手改）
        run: cd website && pnpm run check:primitives

      - name: 双语对齐门禁（★#493：EN overlay 与 zh 结构签名漂移阻断——章节/表格/围栏）
        run: cd website && pnpm run check:en-drift

      # ★2026-09-20 新增：官网数字门禁——`website/src/stats.ts` 声明的数字必须与源码实际值一致
      #   （此前无任何校验，实测 8 项里 7 项长期过时：包数 40/41 并存、单测 2966→3441、原语 176→183…）
      - name: 官网数字门禁（stats.ts 声明值 vs 源码实际值——防「数字过时」静默上线）
        run: cd website && pnpm run check:stats

      # ★2026-09-29 新增：Vapor 文档数字门禁——`framework/43-vapor-update-path.md`（zh+en）引用的
      #   真机性能数字必须能从 `hosts/ios/results/bench-filtered-*.json` **重算**。
      #   背景：`check:stats` 只覆盖 8 项静态计数，**性能数字零覆盖** ⇒ 报告重跑后文档会静默过期
      #   （本仓已吃过 `绘制 0.667` 在 4 份文档里躺很久的亏）。
      - name: Vapor 文档数字门禁（文档性能数字 ↔ 真机报告——防「报告重跑后文档过期」）
        run: node website/scripts/check-vapor-docs.mjs

      # ★2026-09-29 新增：文档数字门禁——`docs/*.md`（当前态文档）里的权威数字 vs 源码实际值。
      #   背景：check:stats 只覆盖官网 stats.ts，md 文档零覆盖 ⇒ 实测漂移为
      #   183 原语（实际 184）· 69 条规则（实际 111）· 38 个包（实际 43）· 76 个语义组件（实际 77），
      #   且★绘制 0.667（已被证伪的子项口径）残留在 5 份当前态文档里继续被引用。
      - name: 文档数字门禁（docs 当前态文档 ↔ 源码实际值——防「文档数字漂移」）
        run: node scripts/check-docs-stats.mjs

      # ★2026-09-29 新增：验收脚本桩测（**设备无关**）——假 adb 跑完整 acceptance 流程。
      #   背景（用户明令）：「每次都是测试完才发现自己的测试装置有问题」+「禁止这样低效测试验证」。
      #   实测：一天内 acceptance.sh 改 8 轮、白跑 7 次真机全流程（每次 4–6 分钟）。
      #   本步断言 退出码 / shell 错误 / 命令顺序 / 产物齐备 / 跑后自检 / bash 3.2 兼容。
      - name: 验收脚本桩测（设备无关：假 adb 跑完整流程——防「改脚本后直接上真机」）
        run: node hosts/android/acceptance-stub.mjs

      # ★2026-09-29 新增：指令集规格门禁（卡 I1）——规格表从**代码生成**（求值真实 opSize），
      #   `--check` 比对 ⇒ 表与代码不可能漂移（手写规格 = 第 5 份副本，漂移静默）。
      - name: 指令集规格门禁（生成物 ↔ 代码一致——防「规格表与实现漂移」）
        run: node scripts/gen-instruction-spec.mjs --check

      # ★2026-09-29 新增：Vue 兼容性页门禁（卡：Vue 兼容对外出口）——页面从 SSOT
      #   `VUE_COMPAT_MATRIX`（128 项）生成；矩阵随 Vue 版本演进 ⇒ 手抄必然漂移，
      #   而漂移的后果是**用户按过期文档写代码、撞上编译期报错**（53 项是 error）。
      - name: Vue 兼容性页门禁（页面 ↔ SSOT 矩阵一致——防「矩阵变了文档没变」）
        run: node scripts/gen-vue-compat-doc.mjs --check

      # ★2026-09-29 新增：柔性系统对外口径门禁——形态数量（与 FORM_PROFILES 键数机器对账）/
      #   弃用术语（Flex System → Fluid System）/ 命名纪律（书本式半开不得写作「半折」）。
      #   背景：收口评审时发现站内写「六种/七种设备形态」而实际已是 8 个（fold/flip 拆类后未同步）。
      - name: 柔性系统口径门禁（形态数/术语/命名——防「官网说 N 种而源码是 M 种」）
        run: node scripts/check-fluid-wording.mjs

      # ★2026-09-20 新增：外部报告台账门禁——`docs/外部报告台账.json` 的**schema 与自洽性**校验
      #   （必填字段 / 枚举合法 / blocker 必带 repro / partial 必带 related / fixed_in 不得比已验版本新；
      #    台账本身不合格 → exit 2 → CI 红）。
      #   ★注意这里**故意不加 --check**：--check 会把「已修未发布 / 验证不充分」也算未收口 → 常驻红，
      #     那不是 CI 该拦的（未发布是正常中间态）。发布前想确认「报 N 收口 M」用 `pnpm ledger:check`。
      - name: 外部报告台账门禁（schema 与自洽性——防台账腐化）
        run: node scripts/ledger-check.mjs

      # ★2026-09-20 新增：AI 共建**三方一致性**门禁（报告 ↔ 台账 ↔ 回执）——补的是「报了没立项」这个洞：
      #   实测挖出报告第九节报的 fluid 缺件（阻断级）**压根没进台账**，没有任何机器判据能发现。
      #   五条规则：报了必须立项 / 立项必须有出处 / 版本口径一致 / 已收口轮次必须有回执 / 回执必须有轮次。
      - name: AI 共建三方一致性门禁（报告 ↔ 台账 ↔ 回执——防「报了没立项」）
        run: node scripts/cobuild-check.mjs --check

      # ★2026-09-20 新增：共建工具包**分发一致性**门禁——规范源（packages/cli/src/cobuild-assets.ts，
      #   随 @proteus-vue/cli 发布）与 create-proteus 模板里的副本必须逐字一致。
      #   防的是「机制在 CLI 与模板两处漂移」——那样新工程自带的和 proteus cobuild init 装出来的会不一样。
      - name: 共建工具包分发一致性门禁（规范源 ↔ 脚手架模板）
        run: npx tsx scripts/gen-cobuild-kit.mjs --check

      - name: 官网文档引擎测试（WIT 解析/SPEC_DIFF 破坏性分类/播放器/审计）
        run: npx vitest run tests/website-plugin-docs.test.ts tests/website-playground.test.ts tests/cli-d2-audit.test.ts tests/website-docs-engine.test.ts tests/website-reference.test.ts

      - name: D-2 页面门禁（★#448：audit d2——官网=验证场零容忍）
        run: npx tsx packages/cli/src/index.ts audit d2 website/src

  e2e-web:
    name: Web E2E（Playwright，需 Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 构建 workspace 包（build:web 消费 @proteus-vue/* 的 dist——fresh 环境必需）
        run: node scripts/build-packages.mjs
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      # ★★★G-61 B1（2026-10-05）：CSE ≡ 真浏览器 getComputedStyle（判据①-b · 113 用例 / 153 项）
      #   ——"IR 是真值基准的规范化载体"的机器判据：CSE 是被测方，浏览器是真值（D1）
      - name: CSE ⇄ 浏览器逐属性一致性（G-61 B1 · 判据①-b）
        run: pnpm run test:cse-parity

      # ★★★G-61 B2（2026-10-05）：动态 :class 预计算 ⇄ 浏览器**逐组合**实测（判据①-B2）
      - name: 动态 :class 计划 ⇄ 浏览器逐组合（G-61 B2）
        run: pnpm run test:cse-dynamic

      - name: Web E2E（SPA 跳转 / 转场 / tap 计数）
        run: pnpm run test:e2e:web

      # ★2026-09-26：官网多端同屏「真几何」门禁（双视口 × 七形态，真 Chromium 布局）——
      #   jsdom 无布局引擎，此前「内容重叠」类缺陷只能在用户机上被发现
      - name: 官网真几何门禁（多端同屏 · 窄/宽双视口）
        run: pnpm run test:e2e:website
