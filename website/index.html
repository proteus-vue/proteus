<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proteus — One semantic model. Any render engine. Zero native glue.</title>
    <meta property="og:title" content="Proteus — 为现代跨端应用而生的 Vue 语义引擎" />
    <meta property="og:description" content="一套语义内核，任意渲染引擎，任意原生能力——Web、小程序、Flutter、原生 UIKit / Jetpack / ArkUI，都是 SPI 的一种实现。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://proteus-vue.cn/" />
    <meta property="og:site_name" content="Proteus" />
    <meta property="og:image" content="https://proteus-vue.cn/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary" />
    <!-- ★★★2026-10-11 暗色主题色：部分移动/国产内核用 theme-color 绘制浏览器 UI 与导航初始背板——
         声明深色可减少「加载瞬间白底」（与 color-scheme:dark 同源）。 -->
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="Proteus：语义收敛的跨端应用框架。一套语义内核，任意渲染引擎，任意原生能力——渲染底座、编译器、宿主容器、执行载体全部可插拔。" />
    <!-- ★2026-09-12 站点图标 = 品牌立方体（与导航 brand-mark / 小程序头像同源） -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="mask-icon" href="favicon.svg" color="#8b5cf6" />
    <!-- ★★★2026-10-11 首屏白闪修复（FOUC）：html/body 深色底原**只在外部样式表**（src/style.css）
         ⇒ 样式表加载/应用前浏览器用**默认白底**首绘 ⇒ 打开站点**闪白一下**（用户实测）。
         此处内联最小关键样式：首帧即深色底（与 src/style.css 的 --bg 同值），样式表到达后自然接管。
         ★只放"首屏必需"（底色 + 文本色 + 去边距）——不复制设计 token（那是样式表职责，避免两处漂移）。
         ★`color-scheme:dark`：让内核在「页面背景生效前」用**暗色**（而非默认白）绘制初始视口兜底——
           这是暗色站点消除整屏加载闪白的标准手段（白底来自浏览器默认 viewport 背板，非页面元素）。 -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0b0b0f; color: #f4f4f7; }
    </style>
  </head>
  <body>
    <!-- ★★★2026-10-11 暗色启动遮罩（boot cover）：用**真实 DOM 元素**（而非只靠 html/body 背景）钉住
         整个「HTML→应用挂载」窗口为深色。部分内核（QQ/360 等国产 X5）对 html 背景的初始视口绘制不可靠，
         会露出默认白底；一个 fixed 全屏深色 div 作为内容被合成器绘制，比背景色更可靠地覆盖首帧窗口。
         由 src/main.ts 在应用挂载后移除（其下已是深色页面，无感）；`load` 事件兜底（挂载失败也不挡住）。 -->
    <div id="proteus-boot" style="position:fixed;inset:0;z-index:2147483647;background:#0b0b0f"></div>
    <!-- ★★★2026-10-08：挂载根 id 由裸词 `app` 改为命名空间 `proteus-app`——
         文档内容里出现同名标题（如配置参考的 app 字段）时，其锚点 id 会**与挂载根撞车**：
         `#app { min-height:100vh }` 会把那个标题撑成整屏（用户实测「点 app 看到大片空白」），
         且页内锚点会跳到挂载根而非标题。挂载根是内部实现、锚点是公开契约 ⇒ 让挂载根让位。
         守卫：tests/website-anchor-collision.test.ts（壳 id 不得与任何文档标题锚点相同）。 -->
    <div id="proteus-app"></div>
    <!-- ★2026-09-11 dev 修复：Playground 在浏览器内联编译（@proteus-vue/compiler → @babel/*），
         而 @babel/types 等 CJS 依赖引用 `process.env.BABEL_TYPES_8_BREAKING`（bare process）。
         生产构建靠 NODE_ENV 替换裁掉该分支；**dev 模式** Vite 不注入 bare process → 模块初始化抛
         `ReferenceError: process is not defined` → 应用不挂载（页面空白）。
         这里在 module 之前定义最小 shim（NODE_ENV 留空 → Vue 等库按 dev 语义走）。 -->
    <script>
      window.process = window.process || { env: {} };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
