<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Proteus Studio</title>
<style>
  /* ★★首帧底色必须**内联在 head 里**（决策 #1381）：
     WebView 在应用我们的 CSS 之前是**白底** —— 那就是用户看到的"启动白屏"。
     这里与 styles.css 的 `--bg-canvas` 同值，保证从第一帧起就是 Studio 的底色。 */
  html, body { margin: 0; height: 100%; background: #0b0c0f; }

  /* ★启动画面（#1381）：纯内联、零外部资源，保证立刻能画出来。
     主流 IDE 的做法都是"先给一张暗色标记 + 轻微动效"，界面就绪后淡出 ——
     等待期间用户看到的是"正在启动"，而不是空白。 */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; background: #0b0c0f; color: #e6e8ee;
    font: 13px/1.45 -apple-system, "PingFang SC", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    transition: opacity .2s ease;
  }
  #splash.done { opacity: 0; pointer-events: none; }
  /* ★启动画面用**品牌 mark**（`docs/brand/studio-mark.svg`：立方体 + 四角取景/扫描括号），
     而不是 App 图标（紫底 P，决策 #1383）：
       · 深色启动画面里，紫色高饱和方块像"贴上去的"；mark 自带深底，只比背景亮一档；
       · 四角括号 = 抓取设备画面的语汇，比一个字母更能说明产品在做什么；
       · 与下方字标互补（图形 ≠ 文字），不重复。
     Dock/启动台仍用 App 图标（系统图标需要强识别），两者各管一摊。
     SVG 只有 3KB 且任意尺寸清晰，比 128px PNG（9KB）更省。
     ★以 **data URI 内联**，与文档同帧绘制 —— 独立请求会晚到，logo 会"蹦"出来。
     为什么不用 `<img src="./logo.png">`：那是独立请求，会在首帧之后才到 ⇒
     先出空白框、logo 再"蹦"出来，等于又一次闪烁。128px 的 PNG 只有 9KB（base64 12KB），
     重生成：base64 -i docs/brand/studio-mark.svg   */
  #splash .logo {
    width: 84px; height: 84px;               /* 品牌 mark 自带圆角深底 ⇒ 不再叠圆角/投影 */
    -webkit-user-drag: none;
  }
  #splash .mark { font-size: 14px; letter-spacing: .18em; opacity: .9; }
  #splash .mark b { font-weight: 600; }
  #splash .mark span { color: #6d7480; }
  #splash .dots { display: flex; gap: 7px; height: 10px; align-items: center; }
  #splash .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: #39414d;
    animation: sp 1.05s ease-in-out infinite;
  }
  #splash .dots i:nth-child(2) { animation-delay: .14s; }
  #splash .dots i:nth-child(3) { animation-delay: .28s; }
  @keyframes sp {
    0%, 100% { opacity: .28; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
  #splash .hint { font-size: 11px; color: #6d7480; letter-spacing: .04em; }

  /* 尊重系统"减少动态效果" */
  @media (prefers-reduced-motion: reduce) {
    #splash .dots i { animation: none; opacity: .6; }
  }
</style>
</head>
