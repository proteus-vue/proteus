<?xml version="1.0" encoding="UTF-8"?>
<!-- Proteus Studio 应用图标（决策 #1235 · 去 AI 味版）
     与 docs/brand 的关系：字母 P 取自 Proteus，容器取品牌紫（正式）/ 绿（预览）。
     ★生产标准：单色同族两档渐变 + 一个精确字形，**没有**回光、扫带、投影、三色带、粒子光晕。
     那些是"AI 生成图标"的典型痕迹：每层都想加戏，结果每处都发灰。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 单色同族两档：不是"紫→蓝→绿"的多色带，也没有回光/扫带/投影。
         大厂的扁平图标基本只有"一个色相 + 一档明度差"（Xcode 蓝、VS Code 蓝同款做法） -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#24B287"/>
      <stop offset="1" stop-color="#0E8F66"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#tile)"><rect x="100" y="100" width="824" height="824" fill="url(#bg)"/></g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <g transform="translate(512,512) scale(1.12) translate(-512,-512) translate(-32,0)">
    <path d="M408 284 H 566 A 114 114 0 0 1 680 398 A 114 114 0 0 1 566 512 H 408"
          fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="butt"/>
<rect x="356" y="232" width="104" height="556" fill="#ffffff"/>
  </g>
</svg>
