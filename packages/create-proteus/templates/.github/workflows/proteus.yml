name: Proteus CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: proteus check（四域门禁）
        run: npx proteus check
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx proteus build --target web
      - run: npx proteus build --target skyline
      - uses: actions/upload-artifact@v4
        with:
          name: proteus-dist
          path: |
            dist/
            dist/mp-weixin/
