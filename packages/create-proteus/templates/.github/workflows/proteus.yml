# AUTO-GENERATED by @proteus-vue/create-proteus 模板（cli-plus G-33 M4）。可自由编辑。
# 流水线：proteus check（CSS/Style/Router/CLI 四域门禁）→ 双端构建 → 测试（L1-L3 + Web E2E；automator 仅 Mac runner）
name: Proteus CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: proteus check（四域门禁）
        run: npx proteus check
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx proteus build --target web
      - run: npx proteus build --target skyline
      - uses: actions/upload-artifact@v4
        with:
          name: proteus-dist
          path: |
            dist/
            dist/mp-weixin/
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 单测 + 编译快照（L1-L3）
        run: npx proteus test
      - name: Web E2E（Playwright headless）
        run: npx proteus build --target web && npx proteus test e2e:web
