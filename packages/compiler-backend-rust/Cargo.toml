[package]
name = "proteus-compiler-backend-rust"
version = "0.1.0"
edition = "2021"
description = "G-29 B2 RustBackend：同一份 Vue SFC → 语义等价的 CompilerIR（G-29.1 铁律）——Node/Rust/WASM 三端产出同一 IR；SWC/oxc 为 JS 侧生态，Vue template 的 Rust 解析用轻量扫描器过渡"
license = "Apache-2.0"

[[bin]]
name = "proteus-cc-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# ★★★G-61 B0 取证（2026-10-05）：serde_json 默认的快速浮点解析**非正确舍入**
#   （实测："123456789012345680000" 解析结果比 JS Number() 低 1 ULP ⇒ Display 出 ...5670000 vs JS ...5680000）
#   ⇒ StyleIR 规范化编码（style_ir_canon.rs）要求「同文本 + 同语义 ⇒ 同字节」，解析必须正确舍入。
#   float_roundtrip 只在浮点解析路径增加约 2× 成本（本 CLI 为编译期工具，可接受）。
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 2